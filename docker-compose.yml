# ---------------------------------------------------------------------------
# 321 Clementi Parking Barcode — Coolify / self-hosted production stack
#
#   web     Astro SSR (Bun) — the redemption portal + API
#   db      PostgreSQL 16   — voucher_pool, redemption_logs, shops, audit logs
#   nocodb  Admin UI        — mall management CRUD over the same database
#
# Deploy:
#   cp .env.example .env && $EDITOR .env      # fill every value marked REQUIRED
#   docker compose up -d db
#   docker compose run --rm web bun run db:migrate     # apply 0001-0005
#   docker compose up -d web
#   docker compose --profile nocodb up -d nocodb       # only if NocoDB is not already running
#
# Full runbook, rollback and verification: docs/operations/COOLIFY_DEPLOYMENT.md
# ---------------------------------------------------------------------------
name: 321clementi-parking

services:
  # -------------------------------------------------------------------------
  # Astro SSR application container (adapter: @astrojs/node standalone)
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the build — Astro evaluates its CSRF origin allowlist at
        # build time. Add every hostname the portal is served from, comma
        # separated and without a scheme, e.g. "321clementi.pancatz.com".
        ALLOWED_SITE_DOMAINS: ${ALLOWED_SITE_DOMAINS:-}
    image: 321clementi-parking-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"

      # --- database -------------------------------------------------------
      # `db` is the compose service name — the container reaches it over the
      # internal network. Do NOT point this at a published host port.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-clementi}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-clementi_redemption}"
      # Bun SQL pool ceiling. One web replica against PG's default
      # max_connections=100 leaves ample headroom.
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_CONNECT_TIMEOUT: ${PG_CONNECT_TIMEOUT:-10}

      # --- PII / admin ----------------------------------------------------
      # HMAC-SHA256 pepper for vehicle-plate hashing (PDPA / SEC-05).
      # Generate each with `openssl rand -hex 32`.
      PLATE_HMAC_SECRET: ${PLATE_HMAC_SECRET:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}

      # --- receipt verification (Gemini Vision) ---------------------------
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # When set, receipt verification is delegated to this n8n webhook
      # instead of calling Gemini directly. Blank uses Gemini.
      N8N_RECEIPT_VERIFIER_URL: ${N8N_RECEIPT_VERIFIER_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.pancatz.com/webhook/clementi-redemption}

      # --- public (browser-visible) ---------------------------------------
      PUBLIC_REDEMPTION_WEBHOOK_URL: ${PUBLIC_REDEMPTION_WEBHOOK_URL:-https://n8n.pancatz.com/webhook/clementi-redemption}
      # Inert on this branch: the Turnstile gate was removed from the app, so
      # neither key is read. Kept so an existing .env still validates.
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}

      # --- admin UI reference ---------------------------------------------
      NOCODB_URL: ${NOCODB_URL:-http://nocodb:8080}

    # No published host port — by design, and load-bearing. Ingress is the
    # Coolify/Traefik proxy's job: it reaches this container over the
    # `clementi` network via the domain assigned to the service. A published
    # mapping here would bypass Traefik and the Cloudflare Tunnel, dropping the
    # Cloudflare WAF and stripping `cf-connecting-ip` — the one header
    # src/utils/rate-limiter.ts trusts for per-client bucketing. A direct
    # caller controls the fallback `x-forwarded-for`, which would make the
    # 3-per-5-minute redemption limit trivially bypassable.
    #
    # Local/CI verification must use docker-compose.verify.yml, which adds a
    # loopback-bound (127.0.0.1) mapping. Never add a mapping to this file.
    expose:
      - "4321"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

    # The runtime drops to a non-root user in the Dockerfile; these keep it
    # there and stop a colocated stack from filling the host disk.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [clementi]

  # -------------------------------------------------------------------------
  # PostgreSQL 16 (migrations 0001-0005)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # NOTE — this file deliberately uses no `${VAR:?message}` "required"
      # syntax. Coolify parses it and, when VAR is unset, substitutes the
      # *message text itself* as the value instead of aborting the deploy. That
      # is exactly how the first production deploy ended up with
      # POSTGRES_USER="POSTGRES_USER is required", a `db` that never went
      # healthy and a poisoned pgdata volume. Defaults and empty values fail
      # loudly inside the containers instead: postgres refuses to initialise
      # without a password, src/db/connection.ts throws without DATABASE_URL,
      # and isAuthorized() denies every admin request without ADMIN_API_KEY.
      POSTGRES_USER: ${POSTGRES_USER:-clementi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-clementi_redemption}
      # Deterministic collation for voucher_code / slug ordering.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot only (empty data directory): creates the nocodb_meta
      # database so NocoDB's ~140 nc_* metadata tables never land in the
      # application schema. See scripts/postgres-init/10-nocodb-meta.sql.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    # No published port — only `web` (and NocoDB, when enabled here) need to
    # reach it. For an ad-hoc psql session use:
    #   docker compose exec db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
    # (the `sh -c` matters: a bare `psql -U "$POSTGRES_USER"` is expanded by the
    # *host* shell, which usually does not have those variables set.)
    healthcheck:
      # `$$VAR` is deliberate: Compose expands `$VAR` on the host at parse time,
      # `$$VAR` reaches the container and is expanded by its own shell. Quoting
      # then keeps a value containing whitespace as a single argument — without
      # it, `pg_isready -U POSTGRES_USER is required` dies with
      # `too many command-line arguments (first is "is")` and the container never
      # reports healthy, so `web` never starts.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [clementi]

  # -------------------------------------------------------------------------
  # NocoDB admin UI — OPTIONAL
  #
  # Start this only if the host does not already run NocoDB. If
  # nocodb.pancatz.com is already served, point that instance at this database
  # using the connection parameters in docs/operations/COOLIFY_DEPLOYMENT.md §4.
  #
  #   docker compose --profile nocodb up -d nocodb
  # -------------------------------------------------------------------------
  nocodb:
    # Pinned, not `latest`. The least-privilege boundary is calibrated against
    # this release's data-source behaviour (the `42501` responses recorded in
    # the runbook): an unreviewed upstream release plus `restart:
    # unless-stopped` could change it on the next restart. Every other image in
    # this file is pinned for the same reason.
    image: nocodb/nocodb:2026.09.0
    profiles: [nocodb]
    restart: unless-stopped
    environment:
      # NocoDB's own metadata store, in its own database — pointed at the app
      # database it would dump ~140 `nc_*` tables into `public` alongside
      # shops / voucher_pool / redemption_logs.
      NC_DB: "pg://db:5432?u=${POSTGRES_USER:-clementi}&p=${POSTGRES_PASSWORD:-}&d=${NC_META_DB:-nocodb_meta}"
      # Required for any non-local deployment — signs NocoDB session tokens.
      # Left empty rather than `${VAR:?message}` so Coolify cannot substitute the
      # message text as a signing key; NocoDB then generates its own.
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:-}
      # Public URL used in invitation/password-reset links and Swagger docs.
      NC_SITE_URL: ${NOCODB_URL:-http://localhost:8080}
      # The application data source is on the private compose network, and
      # NocoDB refuses private/localhost data sources without this. Scope the
      # exposure: the source is the least-privilege `mall_operations` role
      # created by scripts/nocodb-db-roles.sql, not POSTGRES_USER.
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
      NC_DB_POOL_MAX: "10"
      NC_DISABLE_TELE: "true"
      NC_DISABLE_SUPPORT_CHAT: "true"
      # Optional: pre-provision the super admin so the first visit skips the
      # signup prompt. Setting NC_ADMIN_EMAIL without a password aborts boot.
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:-}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-}
    volumes:
      - nocodb-data:/usr/app/data
    # No published host port. Reach the bundled UI through the domain Coolify
    # assigns to this service (Traefik owns ingress) or an ssh tunnel. Two
    # reasons not to publish it: it would bypass the Cloudflare Tunnel, and on a
    # host that already runs Coolify the default port collides with
    # coolify-proxy's own :8080 binding, so the container would not start.
    expose:
      - "8080"
    # Upstream runs this image as root; no-new-privileges is still worth having
    # and does not change behaviour. `cap_drop: [ALL]` is deliberately NOT set
    # here — unlike `web`, this is a third-party image whose startup has not
    # been audited for capability requirements.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks: [clementi]

volumes:
  pgdata:
  nocodb-data:

networks:
  clementi:
    driver: bridge
