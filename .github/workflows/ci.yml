name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript types
        run: bun run typecheck

      # tsc --noEmit does NOT typecheck .astro <script> blocks, so component
      # script errors (undeclared identifiers, changed function arity) slip past
      # the step above. This gate catches them — see PAN-104 defects D1/D2.
      - name: Typecheck Astro components
        run: npx astro check

      - name: Build web portal
        run: bun run build

      # Guards the SSR regression that silently breaks every API route: without
      # `output: 'server'` plus an adapter, Astro prerenders src/pages/api/** at
      # build time and ships empty response bodies. A green `astro build` alone
      # does not prove the routes are server-rendered.
      - name: Assert the build produced a server bundle, not prerendered APIs
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs \
            || { echo '::error::dist/server/entry.mjs missing — the Astro adapter or output:server was removed from astro.config.mjs'; exit 1; }
          if [ -d dist/api ]; then
            echo '::error::dist/api exists — API routes were prerendered at build time; they will serve frozen empty responses'
            exit 1
          fi
          echo 'SSR server bundle present; no prerendered API routes.'

      - name: Pre-pull test database image
        run: docker pull postgres:16-alpine

      - name: Run test suite
        run: bun test

  container:
    name: Container & Deployment Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fails fast on YAML errors and on unresolved ${VAR:?} guards. The values
      # are throwaway CI placeholders, never real secrets.
      - name: Validate docker-compose configuration
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          PLATE_HMAC_SECRET: ci-placeholder-not-a-secret
          ADMIN_API_KEY: ci-placeholder-not-a-secret
        run: |
          set -euo pipefail
          docker compose config --quiet
          echo 'compose configuration valid'

          # Port-exposure guard. The deployable file must publish NOTHING on the
          # host: a published mapping bypasses Traefik and the Cloudflare Tunnel,
          # which drops the WAF and strips `cf-connecting-ip` — the header
          # src/utils/rate-limiter.ts trusts for per-client bucketing. Only the
          # never-deployed verification overlay may publish a port, and only on
          # loopback. Regression guard for the PAN-109 security review; a
          # `-p 4321:4321`-style default previously slipped past `config --quiet`.
          docker compose config --format json > /tmp/base.json
          docker compose -f docker-compose.yml -f docker-compose.verify.yml \
            config --format json > /tmp/verify.json

          python3 - <<'PY'
          import json, sys

          def doc(path):
              with open(path) as fh:
                  return json.load(fh)

          failed = False
          for path in ('/tmp/base.json',):
              for name, svc in doc(path).get('services', {}).items():
                  for port in (svc.get('ports') or []):
                      print(f'::error file=docker-compose.yml::service {name} '
                            f'publishes {port} — the deployable file must publish '
                            f'no host port (use docker-compose.verify.yml)')
                      failed = True

          for name, svc in doc('/tmp/verify.json').get('services', {}).items():
              for port in (svc.get('ports') or []):
                  if port.get('host_ip') != '127.0.0.1':
                      print(f'::error file=docker-compose.verify.yml::service {name} '
                            f'publishes {port} on all interfaces — verification '
                            f'port mappings must be bound to 127.0.0.1')
                      failed = True

          # The `clementi` network name is the documented bridge target for the
          # centralized NocoDB (docs/operations/COOLIFY_DEPLOYMENT.md §4), and the
          # verification overlay must land on a different one: a literal `name:`
          # wins over `docker compose -p`, so a project name alone no longer
          # isolates a throwaway database from the production network.
          for path, fname, expected in (
              ('/tmp/base.json', 'docker-compose.yml', '321clementi-parking_clementi'),
              ('/tmp/verify.json', 'docker-compose.verify.yml', '321clementi-parking-verify_clementi'),
          ):
              actual = (doc(path).get('networks') or {}).get('clementi', {}).get('name')
              if actual != expected:
                  print(f'::error file={fname}::network clementi is named {actual!r}, '
                        f'expected {expected!r} — the NocoDB bridge step depends on the '
                        f'first name being stable, and the second keeps verification off '
                        f'the production network')
                  failed = True

          # The production name must be a literal too. An env-var indirection
          # would let Coolify's environment panel rename the network, and this
          # guard cannot see it through `config` — the output shows the expanded
          # default either way.
          with open('docker-compose.yml') as fh:
              if 'CLEMENTI_NETWORK_NAME' in fh.read():
                  print('::error file=docker-compose.yml::the production network name is '
                        'env-overridable — keep it a literal and put any override in '
                        'docker-compose.verify.yml instead')
                  failed = True

          if failed:
              sys.exit(1)
          print('compose guards OK — deployable file publishes no host port, '
                'verification overlay is loopback-only and network-isolated, '
                'network names pinned and not env-overridable')
          PY

      # Builds the production image, boots PostgreSQL 16 + the web container,
      # applies migrations 0001–0005 from inside the runtime image, then drives a
      # real receipt -> voucher -> barcode redemption and a duplicate rejection.
      # This is the only gate that exercises the built image, the migration
      # runner and the API routes together.
      - name: Build and verify the container stack
        run: bun scripts/verify-container-stack.mjs
