name: CI

on:
  push:
    branches:
      - main
      # The `vercel` deployment branch is long-lived (Vercel deploys from it), so
      # its pushes must be gated directly rather than only via PRs — a
      # deployment branch with no CI on push can drift unverified.
      - vercel
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # On this branch astro.config.mjs defaults to the Vercel adapter, so the
    # Docker/Node path must be requested explicitly — otherwise the assertions
    # below would inspect a Vercel artifact and the Node build would go
    # unchecked. `main` builds Node by default.
    env:
      DEPLOY_TARGET: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript types
        run: bun run typecheck

      # tsc --noEmit does NOT typecheck .astro <script> blocks, so component
      # script errors (undeclared identifiers, changed function arity) slip past
      # the step above. This gate catches them — see PAN-104 defects D1/D2.
      - name: Typecheck Astro components
        run: npx astro check

      - name: Build web portal
        run: bun run build

      # Guards the SSR regression that silently breaks every API route: without
      # `output: 'server'` plus an adapter, Astro prerenders src/pages/api/** at
      # build time and ships empty response bodies. A green `astro build` alone
      # does not prove the routes are server-rendered.
      - name: Assert the build produced a server bundle, not prerendered APIs
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs \
            || { echo '::error::dist/server/entry.mjs missing — the Astro adapter or output:server was removed from astro.config.mjs'; exit 1; }
          if [ -d dist/api ]; then
            echo '::error::dist/api exists — API routes were prerendered at build time; they will serve frozen empty responses'
            exit 1
          fi
          echo 'SSR server bundle present; no prerendered API routes.'

      - name: Pre-pull test database image
        run: docker pull postgres:16-alpine

      - name: Run test suite
        run: bun test

  # The serverless target produces a different artifact (`.vercel/output`), which
  # the Node job above cannot see. This job builds and *runs* exactly what Vercel
  # ships — see scripts/deploy-verify-smoke.mjs.
  vercel:
    name: Vercel Serverless Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_TARGET: vercel
      # Build-time CSRF allowlist (astro.config.mjs). A public hostname, not a
      # secret — it is embedded in the emitted manifest, and the assertion below
      # proves the plumbing resolved it instead of silently substituting
      # `localhost`.
      ALLOWED_SITE_DOMAINS: 321clementi.pancatz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Vercel
        run: bun run build

      # `astro build` with the Vercel adapter emits the Build Output API v3 tree.
      # A regression here is silent and fatal: without the adapter, or with a
      # stray `outputDirectory` in vercel.json, Astro prerenders every API route
      # at build time and Vercel serves a frozen build-time response instead of
      # running the handler.
      - name: Verify API routes are serverless-bound
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions/_render.func
          test -f .vercel/output/static/index.html
          bun -e '
            const cfg = await Bun.file(".vercel/output/config.json").json();
            const expected = [
              "^/api/v1/admin/shops/?$",
              "^/api/v1/redemptions/history/?$",
              "^/api/v1/redemptions/unclaim/?$",
              "^/api/v1/redemptions/?$",
              "^/api/v1/shops/?$",
            ];
            const dests = Object.fromEntries(
              cfg.routes.filter((r) => r.src?.startsWith("^/api/")).map((r) => [r.src, r.dest])
            );
            const bad = expected.filter((k) => dests[k] !== "_render");
            if (bad.length) {
              console.error("API routes not bound to a serverless function:", bad);
              process.exit(1);
            }
            console.log(`All ${expected.length} API routes are serverless-bound.`);
          '

      # `output: 'server'` also enables Astro's security.checkOrigin CSRF
      # middleware, which derives this deployment's own origin from the
      # x-forwarded-host header Vercel sends — but only for hostnames listed in
      # security.allowedDomains. With an empty list Astro silently substitutes
      # `localhost`, and every same-origin POST from a real domain is rejected
      # with "403 Cross-site POST form submissions are forbidden".
      - name: Verify CSRF origin allowlist is populated
        run: |
          set -euo pipefail
          MANIFEST=$(ls .vercel/output/functions/_render.func/dist/server/manifest_*.mjs)
          if ! grep -q '"allowedDomains":\[{' "$MANIFEST"; then
            echo "::error::security.allowedDomains resolved to an empty list — Astro will treat this deployment's own origin as localhost and reject every same-origin POST with '403 Cross-site POST form submissions are forbidden'."
            echo "Fix security.allowedDomains in astro.config.mjs."
            exit 1
          fi
          echo "allowedDomains: $(grep -o '"allowedDomains":\[[^]]*\]' "$MANIFEST")"

      - name: Pre-pull test database image
        run: docker pull postgres:16-alpine

      # The gates above only inspect artifacts. This one runs the artifact: it
      # boots the built function under the real Node runtime with Vercel's
      # forwarded headers and asserts a same-origin form POST is not 403. That
      # is the only check that exercises the CSRF origin path end to end, and
      # it also covers POST /api/v1/redemptions, which no unit test imports.
      #
      # Also proves the `postgres` driver works on the Node runtime: the unit
      # suite runs under Bun, which ships its own SQL client and cannot catch a
      # Bun-only code path.
      - name: Serverless deployment smoke test
        run: bun run verify:deploy

  container:
    name: Container & Deployment Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fails fast on YAML errors and on unresolved ${VAR:?} guards. The values
      # are throwaway CI placeholders, never real secrets.
      - name: Validate docker-compose configuration
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          PLATE_HMAC_SECRET: ci-placeholder-not-a-secret
          ADMIN_API_KEY: ci-placeholder-not-a-secret
          NC_AUTH_JWT_SECRET: ci-placeholder-not-a-secret
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose --profile nocodb config --quiet
          echo 'compose configuration valid (default and nocodb profiles)'

          # Port-exposure guard. The deployable file must publish NOTHING on the
          # host: a published mapping bypasses Traefik and the Cloudflare Tunnel,
          # which drops the WAF and strips `cf-connecting-ip` — the header
          # src/utils/rate-limiter.ts trusts for per-client bucketing. Only the
          # never-deployed verification overlay may publish a port, and only on
          # loopback. Regression guard for the PAN-109 security review; a
          # `-p 4321:4321`-style default previously slipped past `config --quiet`.
          docker compose config --format json > /tmp/base.json
          docker compose --profile nocodb config --format json > /tmp/nocodb.json
          docker compose -f docker-compose.yml -f docker-compose.verify.yml \
            config --format json > /tmp/verify.json

          python3 - <<'PY'
          import json, sys

          def services(path):
              with open(path) as fh:
                  return json.load(fh).get('services', {})

          failed = False
          for label, path in (
              ('docker-compose.yml', '/tmp/base.json'),
              ('docker-compose.yml --profile nocodb', '/tmp/nocodb.json'),
          ):
              for name, svc in services(path).items():
                  for port in (svc.get('ports') or []):
                      print(f'::error file=docker-compose.yml::service {name} '
                            f'publishes {port} — the deployable file must publish '
                            f'no host port (use docker-compose.verify.yml)')
                      failed = True

          for name, svc in services('/tmp/verify.json').items():
              for port in (svc.get('ports') or []):
                  if port.get('host_ip') != '127.0.0.1':
                      print(f'::error file=docker-compose.verify.yml::service {name} '
                            f'publishes {port} on all interfaces — verification '
                            f'port mappings must be bound to 127.0.0.1')
                      failed = True

          if failed:
              sys.exit(1)
          print('port-exposure guard OK — deployable file publishes no host port; '
                'verification overlay is loopback-only')
          PY

      # Builds the production image, boots PostgreSQL 16 + the web container,
      # applies migrations 0001–0005 from inside the runtime image, then drives a
      # real receipt -> voucher -> barcode redemption and a duplicate rejection.
      # This is the only gate that exercises the built image, the migration
      # runner and the API routes together.
      - name: Build and verify the container stack
        run: bun scripts/verify-container-stack.mjs
