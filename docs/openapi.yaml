openapi: 3.1.0
info:
  title: 321 Clementi Parking Barcode Engine API
  version: 1.1.0
  description: |
    Autonomous receipt-to-barcode parking redemption engine for 321 Clementi Mall.
    Covers plain-text plate normalization, managed store directory, claim history, and self-service unclaim recovery.
servers:
  - url: https://321clementi-parking-barcode.vercel.app/api/v1
    description: Production Environment
  - url: http://localhost:4321/api/v1
    description: Local Development Environment

paths:
  /shops:
    get:
      summary: Retrieve Tenant Store Directory
      description: |
        Returns list of mall tenant stores for form population. By default, returns only active, promotion-eligible retail stores (excluding non-retail facilities and excluded clinics).
      operationId: getShops
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [Dine, Learn, Relax, Services]
          description: Filter shops by mall directory category
        - name: eligible_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: When true, only returns promotion-eligible stores
      responses:
        '200':
          description: Successful retrieval of tenant shops
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 22
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shop'

  /redemptions:
    post:
      summary: Submit Receipt & Claim Parking Voucher
      description: |
        Intake submission for receipt-to-barcode redemption. Validates receipt photo, plain-text vehicle plate, and selected tenant store. Allocates Code 128 barcode voucher atomically.
      operationId: createRedemption
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [vehiclePlate, receipt, shopId, timestamp]
              properties:
                vehiclePlate:
                  type: string
                  minLength: 2
                  maxLength: 16
                  example: "SBA 1234 A"
                  description: "Plain-text vehicle registration number (SG, MY, or international)"
                receipt:
                  type: string
                  format: binary
                  description: "Proof of spend receipt image (JPEG, PNG, WEBP, max 20MB)"
                shopId:
                  type: string
                  format: uuid
                  example: "8c79b97b-3225-522b-0705-928ef318dcc4"
                  description: "UUID of the qualifying tenant shop from /shops"
                timestamp:
                  type: string
                  format: date-time
                  example: "2026-09-17T12:30:00Z"
      responses:
        '201':
          description: Voucher successfully allocated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RedemptionSuccess'
        '400':
          description: Validation error (spend < $30, invalid plate format, missing shop)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Outside operating hours (12:00–15:00 SGT weekdays only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Daily redemption limit reached for this vehicle plate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Voucher pool depleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /redemptions/history:
    get:
      summary: Retrieve Claim History by Vehicle Plate
      description: |
        Retrieves claim history and recovery status for a given vehicle plate. Allows shoppers to retrieve lost barcodes or initiate unclaim.
      operationId: getPlateHistory
      parameters:
        - name: plate
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 16
          description: Plain-text vehicle registration number
        - name: X-Claim-Token
          in: header
          required: false
          schema:
            type: string
          description: Bearer claim token from client localStorage
      responses:
        '200':
          description: List of redemption records for vehicle plate
          content:
            application/json:
              schema:
                type: object
                required: [success, vehicle_plate, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  vehicle_plate:
                    type: string
                    example: "SBA 1234 A"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RedemptionHistoryItem'
        '400':
          description: Missing or invalid car plate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /redemptions/{id}/unclaim:
    post:
      summary: Unclaim Voucher and Release Daily Quota
      description: |
        Releases an active voucher back to the available pool and marks redemption log as UNCLAIMED. Allows shopper to recover from a lost browser session or expired countdown window.
      operationId: unclaimRedemption
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Redemption record UUID
        - name: X-Claim-Token
          in: header
          required: false
          schema:
            type: string
          description: Bearer claim token issued at initial redemption
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_plate:
                  type: string
                  example: "SBA 1234 A"
                receipt_amount:
                  type: number
                  format: float
                  example: 34.50
                  description: "Required for fallback verification if X-Claim-Token is omitted"
                shop_id:
                  type: string
                  format: uuid
                  example: "8c79b97b-3225-522b-0705-928ef318dcc4"
                  description: "Required for fallback verification if X-Claim-Token is omitted"
                reason:
                  type: string
                  example: "MISSED_EXIT_WINDOW"
      responses:
        '200':
          description: Voucher successfully unclaimed and quota released
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Voucher successfully unclaimed. Daily redemption limit has been released."
                  data:
                    type: object
                    required: [redemption_id, vehicle_plate, status, unclaimed_at]
                    properties:
                      redemption_id:
                        type: string
                        format: uuid
                      vehicle_plate:
                        type: string
                      status:
                        type: string
                        example: "UNCLAIMED"
                      unclaimed_at:
                        type: string
                        format: date-time
        '401':
          description: Unauthorized - invalid claim token or secondary factors mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Redemption record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Voucher already unclaimed or outside 2-hour recovery window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Exceeded daily unclaim attempts (max 3/plate/day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Shop:
      type: object
      required: [id, name, slug, category, level, unit, is_eligible]
      properties:
        id:
          type: string
          format: uuid
          example: "7b68a86a-2114-411a-9694-817de207cbb3"
        name:
          type: string
          example: "Huang Tu Di Xi'An Delights"
        slug:
          type: string
          example: "huang-tu-di-xi-an-delights"
        category:
          type: string
          enum: [Dine, Learn, Relax, Services]
          example: "Dine"
        level:
          type: string
          example: "L2"
        unit:
          type: string
          example: "#02-08"
        is_eligible:
          type: boolean
          example: true

    RedemptionSuccess:
      type: object
      required: [redemption_id, vehicle_plate, voucher_code, barcode_format, shop_name, receipt_amount, claim_token, status, expires_at, created_at]
      properties:
        redemption_id:
          type: string
          format: uuid
        vehicle_plate:
          type: string
          example: "SBA 1234 A"
        voucher_code:
          type: string
          example: "CLM-98765432"
        barcode_format:
          type: string
          example: "CODE128"
        shop_name:
          type: string
          example: "Saizeriya"
        receipt_amount:
          type: number
          format: float
          example: 34.50
        claim_token:
          type: string
          example: "ct_8f9e0d1c2b3a4f5e6d7c8b9a0f1e2d3c"
          description: "Bearer secret token to store in client localStorage for unclaim operations"
        status:
          type: string
          enum: [CLAIMED, UNCLAIMED, RE_REDEEMED, EXPIRED]
          example: "CLAIMED"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RedemptionHistoryItem:
      type: object
      required: [id, voucher_code, barcode_format, receipt_amount, receipt_date, shop_name, status, can_unclaim, can_resume, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        voucher_code:
          type: string
          example: "CLM-98765432"
        barcode_format:
          type: string
          example: "CODE128"
        receipt_amount:
          type: number
          format: float
          example: 34.50
        receipt_date:
          type: string
          format: date
          example: "2026-09-17"
        shop_name:
          type: string
          example: "Saizeriya"
        status:
          type: string
          enum: [CLAIMED, UNCLAIMED, RE_REDEEMED, EXPIRED]
          example: "CLAIMED"
        can_unclaim:
          type: boolean
          example: true
        can_resume:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [success, error, message]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "DAILY_LIMIT_EXCEEDED"
        message:
          type: string
          example: "Vehicle SBA 1234 A has already redeemed a complimentary parking voucher for today."
